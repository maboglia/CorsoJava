spring.application.name=contactmanager

# MySQL: valori predefiniti per il laboratorio, sovrascrivibili da variabili d'ambiente
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/contactmanager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta diversa da Quarkus per poter avviare entrambi i progetti
server.port=8081
